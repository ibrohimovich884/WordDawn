<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144C66"/>
      <stop offset="50%" stop-color="#0F2B3B"/>
      <stop offset="100%" stop-color="#192A4D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F2B3B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background shape -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="url(#glow)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Open book base emblem -->
  <g transform="translate(146, 340)" filter="url(#shadow)">
    <path d="M 0,20 Q 55,-4 110,12 Q 165,-4 220,20 L 220,38 Q 165,14 110,28 Q 55,14 0,38 Z" fill="#FFC93C" opacity="0.95"/>
    <path d="M 110,12 L 110,28" stroke="#D99B00" stroke-width="3"/>
  </g>

  <!-- Main 'S' Monogram -->
  <g filter="url(#shadow)">
    <path d="M 325 180 C 325 138 292 110 248 110 C 196 110 162 144 162 190 C 162 255 315 230 315 305 C 315 342 284 365 240 365 C 195 365 158 338 155 292 L 205 292 C 208 314 220 326 240 326 C 263 326 275 312 275 298 C 275 238 122 260 122 188 C 122 120 180 72 248 72 C 316 72 365 116 365 180 Z" 
          fill="url(#sGrad)"/>
  </g>

  <!-- Star sparkle -->
  <path d="M 360,110 Q 375,110 375,95 Q 375,110 390,110 Q 375,110 375,125 Q 375,110 360,110 Z" fill="#FFC93C"/>
</svg>
